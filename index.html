<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>みんばと！リズムパーティ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #ff6b9d;
  --bg2: #ffc93c;
  --bg3: #6bcBFF;
  --bg4: #a78bfa;
  --ink: #2d1b4e;
  --paper: #fff8f0;
  --good: #22c55e;
  --ok: #3b82f6;
  --bad: #ef4444;
  --host: #f59e0b;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; overflow: hidden;
  font-family: 'Fredoka', 'Mochiy Pop One', sans-serif;
  color: var(--ink);
  background: var(--ink);
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
body {
  background:
    radial-gradient(ellipse at 20% 10%, #ff8fab 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, #fde047 0%, transparent 45%),
    radial-gradient(ellipse at 50% 90%, #7dd3fc 0%, transparent 55%),
    radial-gradient(ellipse at 10% 70%, #c4b5fd 0%, transparent 40%),
    linear-gradient(160deg, #ff6b9d, #ff9f43, #6bcBFF);
  background-attachment: fixed;
}
#app { height: 100%; display: flex; flex-direction: column; position: relative; }

/* Screens */
.screen {
  display: none; flex: 1; flex-direction: column;
  padding: calc(12px + var(--safe-t)) 16px calc(16px + var(--safe-b));
  overflow: auto; max-width: 480px; margin: 0 auto; width: 100%;
}
.screen.active { display: flex; animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.logo {
  text-align: center; margin: 8px 0 20px;
  text-shadow: 3px 3px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
}
.logo h1 {
  font-size: clamp(1.8rem, 8vw, 2.4rem); letter-spacing: .04em;
  background: linear-gradient(90deg, #fff, #ffe66d, #fff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 #c0265a);
}
.logo p { color: #fff; font-size: .9rem; margin-top: 4px; text-shadow: 0 1px 2px rgba(0,0,0,.25); }

.card {
  background: rgba(255,248,240,.92); backdrop-filter: blur(8px);
  border-radius: 24px; padding: 20px; margin-bottom: 14px;
  box-shadow: 0 8px 0 rgba(45,27,78,.15), 0 12px 32px rgba(45,27,78,.12);
  border: 3px solid #fff;
}
.card h2 { font-size: 1.15rem; margin-bottom: 12px; }

.btn {
  display: block; width: 100%; border: none; border-radius: 999px;
  padding: 14px 20px; font-family: inherit; font-size: 1.05rem; font-weight: 700;
  cursor: pointer; color: #fff; position: relative;
  box-shadow: 0 5px 0 rgba(0,0,0,.2); transition: transform .1s, box-shadow .1s;
  margin-top: 10px;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.btn-pink { background: linear-gradient(180deg, #ff7aa2, #e11d74); }
.btn-blue { background: linear-gradient(180deg, #7dd3fc, #0284c7); }
.btn-green { background: linear-gradient(180deg, #86efac, #16a34a); }
.btn-purple { background: linear-gradient(180deg, #c4b5fd, #7c3aed); }
.btn-orange { background: linear-gradient(180deg, #fdba74, #ea580c); }
.btn-ghost {
  background: rgba(255,255,255,.35); color: var(--ink);
  border: 2px solid rgba(255,255,255,.8); box-shadow: none;
}
.btn:disabled { opacity: .45; pointer-events: none; }

.row { display: flex; gap: 10px; }
.row .btn { flex: 1; }

input[type="text"] {
  width: 100%; padding: 14px 16px; border-radius: 16px; border: 3px solid #f9a8d4;
  font-family: inherit; font-size: 1.1rem; text-align: center; letter-spacing: .15em;
  background: #fff; color: var(--ink); outline: none;
}
input:focus { border-color: #e11d74; }

.players { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.player-chip {
  background: #fff; border-radius: 999px; padding: 6px 12px; font-size: .85rem;
  border: 2px solid #fbcfe8; display: flex; align-items: center; gap: 6px;
}
.player-chip.host { border-color: var(--host); background: #fffbeb; }
.player-chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); }

.game-grid { display: grid; gap: 10px; }
.game-card {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: #fff; border: 3px solid #fce7f3; border-radius: 18px;
  padding: 12px; cursor: pointer; transition: transform .12s;
  font-family: inherit; color: inherit; width: 100%;
}
.game-card:active { transform: scale(.97); }
.game-card .icon {
  width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;
  font-size: 1.6rem; flex-shrink: 0;
}
.game-card h3 { font-size: 1rem; }
.game-card p { font-size: .72rem; color: #6b7280; margin-top: 2px; line-height: 1.3; }

.status-bar {
  display: flex; justify-content: space-between; align-items: center;
  font-size: .8rem; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.3);
  margin-bottom: 8px; gap: 8px; flex-wrap: wrap;
}
.badge {
  background: rgba(255,255,255,.9); color: var(--ink); padding: 4px 10px;
  border-radius: 999px; font-weight: 700; font-size: .75rem;
}

/* Game HUD */
#game-screen { padding: 0; max-width: none; position: relative; overflow: hidden; }
.hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  padding: calc(8px + var(--safe-t)) 12px 8px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  pointer-events: none;
}
.hud .hud-left, .hud .hud-right { pointer-events: auto; }
.score-panel {
  background: rgba(255,255,255,.92); border-radius: 14px; padding: 8px 12px;
  border: 2px solid #fff; min-width: 90px; box-shadow: 0 4px 12px rgba(0,0,0,.12);
}
.score-panel .label { font-size: .65rem; color: #9ca3af; }
.score-panel .val { font-size: 1.35rem; font-weight: 700; line-height: 1.1; }
.combo-tag { color: #e11d74; font-size: .75rem; font-weight: 700; }
#btn-back-game {
  pointer-events: auto; padding: 8px 14px; font-size: .85rem; margin: 0; width: auto;
}
.lives { display: flex; gap: 4px; margin-top: 4px; }
.lives span { font-size: .9rem; opacity: .35; }
.lives span.on { opacity: 1; }

#canvas-wrap {
  flex: 1; position: relative; width: 100%; height: 100%;
  touch-action: none; overflow: hidden;
}
#gameCanvas { width: 100%; height: 100%; display: block; touch-action: none; }

.judge-fx {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
  font-size: 2.2rem; font-weight: 700; pointer-events: none; z-index: 30;
  text-shadow: 0 3px 0 rgba(0,0,0,.15); opacity: 0;
}
.judge-fx.show { animation: judgePop .55s ease forwards; }
.judge-fx.perfect { color: #fbbf24; }
.judge-fx.great { color: #60a5fa; }
.judge-fx.good { color: #4ade80; }
.judge-fx.miss { color: #f87171; }
@keyframes judgePop {
  0% { opacity: 0; transform: translate(-50%, -40%) scale(.6); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
}

.beat-bar {
  position: absolute; bottom: calc(16px + var(--safe-b)); left: 50%;
  transform: translateX(-50%); z-index: 15;
  display: flex; gap: 10px; align-items: center;
  background: rgba(255,255,255,.85); padding: 8px 16px; border-radius: 999px;
  border: 2px solid #fff;
}
.beat-dot {
  width: 14px; height: 14px; border-radius: 50%; background: #e5e7eb;
  transition: transform .08s, background .08s;
}
.beat-dot.on { background: #e11d74; transform: scale(1.35); box-shadow: 0 0 12px #fb7185; }

.countdown-overlay {
  position: absolute; inset: 0; z-index: 40;
  display: none; place-items: center;
  background: rgba(45,27,78,.45); color: #fff;
  font-size: 5rem; font-weight: 700;
  text-shadow: 0 4px 0 rgba(0,0,0,.25);
}
.countdown-overlay.show { display: grid; }

.result-overlay {
  position: absolute; inset: 0; z-index: 50;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(45,27,78,.55); padding: 24px;
}
.result-overlay.show { display: flex; }
.result-box {
  background: var(--paper); border-radius: 28px; padding: 24px; width: min(360px, 100%);
  border: 4px solid #fff; box-shadow: 0 12px 0 rgba(0,0,0,.15); text-align: center;
}
.result-box h2 { font-size: 1.5rem; margin-bottom: 8px; }
.result-list { text-align: left; margin: 16px 0; }
.result-list .r {
  display: flex; justify-content: space-between; padding: 8px 10px;
  background: #fff; border-radius: 12px; margin-bottom: 6px; border: 2px solid #fce7f3;
}
.result-list .r.me { border-color: #e11d74; background: #fff1f2; }
.result-list .rank { font-weight: 700; width: 28px; }

.toast {
  position: fixed; bottom: calc(24px + var(--safe-b)); left: 50%; transform: translateX(-50%);
  background: rgba(45,27,78,.9); color: #fff; padding: 10px 18px; border-radius: 999px;
  font-size: .85rem; z-index: 100; opacity: 0; pointer-events: none; transition: opacity .25s;
  max-width: 90%; text-align: center;
}
.toast.show { opacity: 1; }

.hint { font-size: .8rem; color: #6b7280; margin-top: 8px; line-height: 1.4; }
.room-code-big {
  font-size: 2rem; letter-spacing: .25em; font-weight: 700; text-align: center;
  color: #e11d74; margin: 8px 0;
}
.online-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 4px; }
.offline-dot { background: #ef4444; }

.name-row { display: flex; gap: 8px; margin-bottom: 8px; }
.name-row input { flex: 1; letter-spacing: normal; text-align: left; font-size: 1rem; }

#solo-banner {
  display: none; text-align: center; font-size: .75rem; color: #fff;
  background: rgba(0,0,0,.25); padding: 4px 8px; border-radius: 8px; margin-bottom: 8px;
}
</style>
</head>
<body>
<div id="app">
  <!-- HOME -->
  <section id="home-screen" class="screen active">
    <div class="logo">
      <h1>みんばと！</h1>
      <p>リズムパーティミニゲーム集</p>
    </div>
    <div class="card">
      <h2>あなたの名前</h2>
      <div class="name-row">
        <input type="text" id="player-name" maxlength="10" placeholder="プレイヤー名" autocomplete="off">
      </div>
      <button class="btn btn-pink" id="btn-create">ルームを作る</button>
      <button class="btn btn-blue" id="btn-join-show">ルームに参加</button>
      <button class="btn btn-purple" id="btn-solo">ひとりで練習</button>
      <p class="hint">スマホのブラウザでタップ＆スワイプ。ホストが先に部屋を作り、表示されたルームIDを共有して2〜4人で対戦しよう！</p>
    </div>
    <div class="card" id="join-panel" style="display:none">
      <h2>ルームIDを入力</h2>
      <input type="text" id="join-code" maxlength="6" placeholder="例: AB12CD" autocomplete="off">
      <button class="btn btn-green" id="btn-join">参加する</button>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="lobby-screen" class="screen">
    <div class="status-bar">
      <span id="net-status"><span class="online-dot"></span>接続中</span>
      <span class="badge" id="room-badge">ROOM ----</span>
    </div>
    <div class="card">
      <h2>ルーム</h2>
      <div class="room-code-big" id="room-code-display">----</div>
      <p class="hint" id="lobby-hint">このIDを友達に伝えてね</p>
      <div class="players" id="player-list"></div>
      <div class="row">
        <button class="btn btn-ghost" id="btn-leave">退出</button>
        <button class="btn btn-orange" id="btn-copy">IDコピー</button>
      </div>
    </div>
    <div class="card">
      <h2>ミニゲームを選ぶ</h2>
      <p class="hint" id="pick-hint">ホストがゲームを選んでスタートします</p>
      <div class="game-grid" id="game-list"></div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game-screen" class="screen">
    <div class="hud">
      <div class="hud-left">
        <div class="score-panel">
          <div class="label">SCORE</div>
          <div class="val" id="hud-score">0</div>
          <div class="combo-tag" id="hud-combo"></div>
          <div class="lives" id="hud-lives"></div>
        </div>
      </div>
      <div class="hud-right">
        <button class="btn btn-ghost" id="btn-back-game">やめる</button>
      </div>
    </div>
    <div id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
      <div class="judge-fx" id="judge-fx"></div>
      <div class="beat-bar" id="beat-bar">
        <div class="beat-dot" data-b="0"></div>
        <div class="beat-dot" data-b="1"></div>
        <div class="beat-dot" data-b="2"></div>
        <div class="beat-dot" data-b="3"></div>
      </div>
      <div class="countdown-overlay" id="countdown"></div>
      <div class="result-overlay" id="result-overlay">
        <div class="result-box">
          <h2 id="result-title">結果発表！</h2>
          <div class="result-list" id="result-list"></div>
          <button class="btn btn-pink" id="btn-result-ok">ロビーへ戻る</button>
        </div>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* ========== Utils ========== */
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const uid = () => Math.random().toString(36).slice(2, 8).toUpperCase();
const wait = (ms) => new Promise(r => setTimeout(r, ms));

function toast(msg, ms = 2200) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(() => t.classList.remove('show'), ms);
}

function showScreen(id) {
  $$('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

/* ========== Audio (Web Audio synth, no assets) ========== */
const AudioBus = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type = 'sine', gain = 0.08, when = 0) {
    try {
      const c = ensure();
      const t0 = c.currentTime + when;
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(Math.max(gain, 0.0001), t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + Math.max(dur, 0.01));
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (_) { /* audio must never block gameplay */ }
  }
  function beatClick(strong) {
    tone(strong ? 880 : 440, 0.05, 'square', strong ? 0.06 : 0.035);
  }
  function sfxJudge(kind) {
    if (kind === 'perfect') { tone(880, .08, 'sine', .1); tone(1320, .12, 'sine', .08, .05); }
    else if (kind === 'great') { tone(660, .08, 'triangle', .08); }
    else if (kind === 'good') { tone(520, .07, 'triangle', .06); }
    else { tone(180, .15, 'sawtooth', .05); }
  }
  function sfxHit() { tone(320, .04, 'square', .05); tone(640, .06, 'sine', .04, .02); }
  function sfxFirework() {
    tone(200, .1, 'sawtooth', .06);
    for (let i = 0; i < 5; i++) tone(400 + i * 120, .08, 'sine', .04, .05 + i * .03);
  }
  return { ensure, tone, beatClick, sfxJudge, sfxHit, sfxFirework };
})();

/* ========== Rhythm Engine ========== */
class RhythmEngine {
  constructor(bpm = 110) {
    this.bpm = bpm;
    this.beatMs = 60000 / bpm;
    this.startTime = 0;
    this.running = false;
    this.beatIndex = 0;
    this.onBeat = null;
    this._lastBeat = -1;
  }
  start(delayMs = 0) {
    this.startTime = performance.now() + delayMs;
    this.running = true;
    this.beatIndex = 0;
    this._lastBeat = -1;
  }
  stop() { this.running = false; }
  now() { return performance.now() - this.startTime; }
  beatFloat() { return this.now() / this.beatMs; }
  measureBeat() { return ((this.beatFloat() % 4) + 4) % 4; }
  tick() {
    if (!this.running) return;
    const bf = this.beatFloat();
    const bi = Math.floor(bf);
    if (bi !== this._lastBeat && bi >= 0) {
      this._lastBeat = bi;
      this.beatIndex = bi;
      const inMeasure = bi % 4;
      AudioBus.beatClick(inMeasure === 0);
      if (this.onBeat) this.onBeat(bi, inMeasure);
    }
  }
  /** Offset from nearest beat in ms (negative = early) */
  offsetFromNearestBeat() {
    const t = this.now();
    const nearest = Math.round(t / this.beatMs) * this.beatMs;
    return t - nearest;
  }
  offsetFromBeat(beatIndex) {
    return this.now() - beatIndex * this.beatMs;
  }
  judge(windowMs = { perfect: 60, great: 110, good: 160 }) {
    const off = Math.abs(this.offsetFromNearestBeat());
    if (off <= windowMs.perfect) return { grade: 'perfect', offset: off, score: 100 };
    if (off <= windowMs.great) return { grade: 'great', offset: off, score: 70 };
    if (off <= windowMs.good) return { grade: 'good', offset: off, score: 40 };
    return { grade: 'miss', offset: off, score: 0 };
  }
  judgeAtTime(targetTime, windowMs = { perfect: 70, great: 130, good: 180 }) {
    const off = Math.abs(this.now() - targetTime);
    if (off <= windowMs.perfect) return { grade: 'perfect', offset: off, score: 100 };
    if (off <= windowMs.great) return { grade: 'great', offset: off, score: 70 };
    if (off <= windowMs.good) return { grade: 'good', offset: off, score: 40 };
    return { grade: 'miss', offset: off, score: 0 };
  }
}

/* ========== Net (Trystero P2P rooms) ========== */
const Net = {
  room: null,
  hostId: null, // room code
  isHost: false,
  solo: false,
  players: new Map(),
  myId: null,
  myName: 'Player',
  onPlayers: null,
  onMessage: null,
  onStatus: null,
  _sendRaw: null,
  _leave: null,
  _selfId: null,

  setStatus(text, ok = true) {
    if (this.onStatus) this.onStatus(text, ok);
  },

  me() {
    return { id: this.myId, name: this.myName, score: this.players.get(this.myId)?.score || 0, isHost: this.isHost };
  },

  _emitPlayers() {
    if (this.onPlayers) this.onPlayers([...this.players.values()]);
  },

  async _loadStrategy() {
    const urls = [
      'https://esm.sh/trystero@0.21.8/mqtt',
      'https://esm.sh/trystero@0.21.8/torrent'
    ];
    let lastErr;
    for (const url of urls) {
      try {
        const mod = await import(url);
        if (!mod.joinRoom || !mod.selfId) throw new Error('invalid module');
        return mod;
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('通信ライブラリの読み込みに失敗しました');
  },

  async _enterRoom(code, name, asHost) {
    this.setStatus('通信準備中…', true);
    const { joinRoom, selfId } = await this._loadStrategy();

    // clean previous session without wiping callbacks
    if (this._leave) { try { this._leave(); } catch {} }
    this.room = null;
    this._sendRaw = null;
    this._leave = null;

    this.solo = false;
    this.isHost = asHost;
    this.myName = name;
    this.hostId = code;
    this.myId = selfId;
    this._selfId = selfId;
    this.players.clear();
    this.players.set(selfId, this.me());
    this._emitPlayers();

    this.setStatus('ルーム接続中…', true);
    const room = joinRoom({ appId: 'minbato-rhythm-party-v1' }, 'MB-' + code);
    this.room = room;

    const [sendMsg, getMsg] = room.makeAction('msg');
    this._sendRaw = sendMsg;
    this._leave = () => { try { room.leave(); } catch {} };

    getMsg((msg, fromId) => {
      if (!msg || typeof msg !== 'object') return;
      this._onPeerMsg(msg, fromId);
    });

    room.onPeerJoin((peerId) => {
      if (!this.players.has(peerId)) {
        this.players.set(peerId, { id: peerId, name: 'プレイヤー', score: 0, isHost: false });
      }
      this._announce();
      this._emitPlayers();
      this.setStatus(`オンライン（${this.players.size}人）`, true);
    });

    room.onPeerLeave((peerId) => {
      this.players.delete(peerId);
      this._emitPlayers();
      this.setStatus(`オンライン（${this.players.size}人）`, true);
    });

    // wait briefly for peers to appear (P2P handshake)
    await wait(800);
    this._announce();
    if (!asHost) {
      const deadline = performance.now() + 15000;
      while (performance.now() < deadline) {
        const others = [...this.players.keys()].filter(id => id !== this.myId);
        let peerCount = 0;
        try { peerCount = room.getPeers ? Object.keys(room.getPeers()).length : 0; } catch {}
        if (others.length > 0 || peerCount > 0) break;
        await wait(500);
        this._announce();
      }
      const others = [...this.players.keys()].filter(id => id !== this.myId);
      let peerCount = 0;
      try { peerCount = room.getPeers ? Object.keys(room.getPeers()).length : 0; } catch {}
      if (others.length === 0 && peerCount === 0) {
        this.destroy();
        throw new Error('ルームに誰もいません。ホストが先に部屋を作って待っていてね');
      }
    }

    if (this.players.size > 4) {
      this.destroy();
      throw new Error('ルームが満員です（最大4人）');
    }

    this.setStatus(`オンライン（${this.players.size}人）`, true);
    this._emitPlayers();
    return code;
  },

  _announce() {
    if (!this._sendRaw) return;
    const p = this.players.get(this.myId);
    this._sendRaw({
      type: 'hello',
      name: this.myName,
      isHost: this.isHost,
      score: p ? p.score : 0
    });
  },

  _onPeerMsg(msg, fromId) {
    if (msg.type === 'hello') {
      const prev = this.players.get(fromId);
      this.players.set(fromId, {
        id: fromId,
        name: msg.name || 'プレイヤー',
        score: typeof msg.score === 'number' ? msg.score : (prev?.score || 0),
        isHost: !!msg.isHost
      });
      this._emitPlayers();
      this.setStatus(`オンライン（${this.players.size}人）`, true);
    } else if (msg.type === 'score') {
      const p = this.players.get(fromId) || { id: fromId, name: 'プレイヤー', isHost: false };
      p.score = msg.score;
      this.players.set(fromId, p);
      this._emitPlayers();
    } else if (msg.type === 'players' && Array.isArray(msg.list)) {
      msg.list.forEach(p => {
        if (p && p.id) this.players.set(p.id, p);
      });
      this._emitPlayers();
    } else if (this.onMessage) {
      this.onMessage(msg, fromId);
    }
  },

  broadcast(msg) {
    if (this.solo) {
      if (this.onMessage) this.onMessage(msg, this.myId);
      return;
    }
    if (this._sendRaw) this._sendRaw(msg);
  },

  send(msg) {
    if (this.solo) {
      if (this.onMessage) this.onMessage(msg, this.myId);
      return;
    }
    // mesh: everyone receives via action; also handle locally for host-originated events
    if (this._sendRaw) this._sendRaw(msg);
    if (this.isHost && this.onMessage) {
      // host already knows locally for start_game etc. — caller also launches locally
    }
  },

  sendToHost(msg) {
    // mesh: just broadcast; host filters if needed
    this.broadcast(msg);
  },

  async createRoom(name) {
    const code = uid();
    await this._enterRoom(code, name, true);
    return code;
  },

  async joinRoom(code, name) {
    const cleaned = code.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (cleaned.length < 4) throw new Error('ルームIDが短すぎます');
    await this._enterRoom(cleaned, name, false);
    return cleaned;
  },

  startSolo(name) {
    if (this._leave) { try { this._leave(); } catch {} }
    this.room = null;
    this._sendRaw = null;
    this._leave = null;
    this.solo = true;
    this.isHost = true;
    this.myName = name;
    this.myId = 'SOLO';
    this.hostId = 'SOLO';
    this.players.clear();
    this.players.set(this.myId, this.me());
    this.setStatus('ソロモード', true);
    this._emitPlayers();
  },

  destroy() {
    if (this._leave) { try { this._leave(); } catch {} }
    this._leave = null;
    this._sendRaw = null;
    this.room = null;
    this.players.clear();
  },

  updateMyScore(score) {
    const p = this.players.get(this.myId);
    if (p) p.score = score;
    else this.players.set(this.myId, { ...this.me(), score });
    this._emitPlayers();
    if (this.solo) return;
    this.broadcast({ type: 'score', score });
  },

  syncPlayers() {
    this.broadcast({ type: 'players', list: [...this.players.values()] });
    this._emitPlayers();
  }
};

/* ========== Shared Game Runner ========== */
const Game = {
  canvas: null,
  ctx: null,
  rhythm: null,
  current: null,
  score: 0,
  combo: 0,
  maxCombo: 0,
  misses: 0,
  maxMiss: 8,
  playing: false,
  ended: false,
  raf: 0,
  W: 0,
  H: 0,
  state: null,
  touch: { active: false, x: 0, y: 0, sx: 0, sy: 0, id: null },

  init() {
    this.canvas = $('#gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this._bindInput();
    window.addEventListener('resize', () => this.resize());
  },

  resize() {
    const wrap = $('#canvas-wrap');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.W = wrap.clientWidth;
    this.H = wrap.clientHeight;
    this.canvas.width = this.W * dpr;
    this.canvas.height = this.H * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },

  _bindInput() {
    const el = this.canvas;
    const getPos = (e) => {
      const r = el.getBoundingClientRect();
      const t = e.changedTouches ? e.changedTouches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    };
    el.addEventListener('pointerdown', (e) => {
      if (!this.playing) return;
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      const p = getPos(e);
      this.touch = { active: true, x: p.x, y: p.y, sx: p.x, sy: p.y, id: e.pointerId };
      if (this.current && this.current.onDown) this.current.onDown(p.x, p.y);
    });
    el.addEventListener('pointermove', (e) => {
      if (!this.touch.active || e.pointerId !== this.touch.id) return;
      const p = getPos(e);
      this.touch.x = p.x; this.touch.y = p.y;
      if (this.current && this.current.onMove) this.current.onMove(p.x, p.y, this.touch);
    });
    el.addEventListener('pointerup', (e) => {
      if (e.pointerId !== this.touch.id) return;
      const p = getPos(e);
      const dx = p.x - this.touch.sx, dy = p.y - this.touch.sy;
      if (this.current && this.current.onUp) this.current.onUp(p.x, p.y, dx, dy);
      this.touch.active = false;
    });
    el.addEventListener('pointercancel', () => { this.touch.active = false; });
  },

  showJudge(grade) {
    const el = $('#judge-fx');
    const labels = { perfect: 'PERFECT!', great: 'GREAT!', good: 'GOOD', miss: 'MISS…' };
    el.textContent = labels[grade] || grade;
    el.className = 'judge-fx show ' + grade;
    AudioBus.sfxJudge(grade);
    clearTimeout(this._jtm);
    this._jtm = setTimeout(() => el.classList.remove('show'), 550);
  },

  applyJudge(j, comboBonus = true) {
    if (j.grade === 'miss') {
      this.combo = 0;
      this.misses++;
      this.showJudge('miss');
    } else {
      this.combo++;
      this.maxCombo = Math.max(this.maxCombo, this.combo);
      const bonus = comboBonus ? Math.min(50, this.combo * 2) : 0;
      this.score += j.score + bonus;
      this.showJudge(j.grade);
      AudioBus.sfxHit();
    }
    this.updateHud();
    Net.updateMyScore(this.score);
    if (this.misses >= this.maxMiss) this.endGame();
  },

  updateHud() {
    $('#hud-score').textContent = this.score;
    $('#hud-combo').textContent = this.combo > 1 ? `${this.combo} COMBO` : '';
    const lives = $('#hud-lives');
    lives.innerHTML = '';
    for (let i = 0; i < this.maxMiss; i++) {
      const s = document.createElement('span');
      s.textContent = '♥';
      if (i < this.maxMiss - this.misses) s.classList.add('on');
      lives.appendChild(s);
    }
    // beat dots
    if (this.rhythm && this.rhythm.running) {
      const mb = Math.floor(this.rhythm.measureBeat());
      $$('.beat-dot').forEach((d, i) => d.classList.toggle('on', i === mb));
    }
  },

  async start(gameDef) {
    AudioBus.ensure();
    this.current = MiniGames[gameDef.id];
    this.rhythm = new RhythmEngine(gameDef.bpm);
    this.score = 0; this.combo = 0; this.maxCombo = 0; this.misses = 0;
    this.playing = false; this.ended = false;
    this.state = {};
    Net.players.forEach(p => p.score = 0);
    Net.updateMyScore(0);
    showScreen('#game-screen');
    this.resize();
    $('#result-overlay').classList.remove('show');
    this.updateHud();

    if (this.current && this.current.init) this.current.init(this);

    // Countdown (audio failures must not freeze here)
    const cd = $('#countdown');
    cd.classList.add('show');
    try {
      for (const n of ['3', '2', '1', 'START!']) {
        cd.textContent = n;
        AudioBus.tone(n === 'START!' ? 880 : 520, .1, 'square', .07);
        await wait(n === 'START!' ? 500 : 700);
      }
    } finally {
      cd.classList.remove('show');
    }

    this.rhythm.start(0);
    this.playing = true;
    this.durationMs = 45000; // 45 sec rounds
    this.endAt = performance.now() + this.durationMs;
    if (this.current && this.current.start) this.current.start(this);
    this.loop();
  },

  loop() {
    if (this.ended) return;
    this.raf = requestAnimationFrame(() => this.loop());
    this.rhythm.tick();
    this.updateHud();
    if (this.current && this.current.update) this.current.update(this);
    if (this.current && this.current.draw) this.current.draw(this);
    if (performance.now() >= this.endAt) this.endGame();
  },

  endGame() {
    if (this.ended) return;
    this.ended = true;
    this.playing = false;
    this.rhythm.stop();
    cancelAnimationFrame(this.raf);
    Net.updateMyScore(this.score);
    // small delay for score sync
    setTimeout(() => this.showResults(), 400);
    if (Net.isHost && !Net.solo) {
      Net.broadcast({ type: 'game_end' });
    }
  },

  showResults() {
    const list = [...Net.players.values()].sort((a, b) => b.score - a.score);
    const box = $('#result-list');
    box.innerHTML = '';
    list.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'r' + (p.id === Net.myId ? ' me' : '');
      const medal = ['🥇', '🥈', '🥉', '🎖️'][i] || `${i + 1}.`;
      div.innerHTML = `<span><span class="rank">${medal}</span>${escapeHtml(p.name)}</span><span>${p.score}点</span>`;
      box.appendChild(div);
    });
    const meRank = list.findIndex(p => p.id === Net.myId) + 1;
    $('#result-title').textContent = meRank === 1 ? '優勝！やったね！' : '結果発表！';
    $('#result-overlay').classList.add('show');
  },

  stopToLobby() {
    this.ended = true;
    this.playing = false;
    if (this.rhythm) this.rhythm.stop();
    cancelAnimationFrame(this.raf);
    $('#result-overlay').classList.remove('show');
    showScreen('#lobby-screen');
    UI.refreshLobby();
  }
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ========== Mini Games ========== */
const MiniGames = {
  /* ---- 1. Window Wipe ---- */
  window: {
    init(g) {
      g.state = {
        dirt: Array.from({ length: 12 }, (_, i) => ({
          x: 0.15 + (i % 4) * 0.22,
          y: 0.28 + Math.floor(i / 4) * 0.22,
          dirt: 1,
          flash: 0
        })),
        expectDir: 1, // 1 right, -1 left alternating each beat
        lastJudgedBeat: -1,
        wipeFx: []
      };
    },
    start(g) {
      g.rhythm.onBeat = (bi, m) => {
        g.state.expectDir = (m % 2 === 0) ? 1 : -1;
      };
    },
    onUp(x, y, dx, dy) {
      const g = Game;
      if (!g.playing) return;
      const swipe = Math.abs(dx) > 28 ? Math.sign(dx) : 0;
      const tap = Math.abs(dx) < 20 && Math.abs(dy) < 20;
      if (!swipe && !tap) return;

      const j = g.rhythm.judge();
      const want = g.state.expectDir;
      const okDir = swipe ? (swipe === want) : true;

      if (j.grade === 'miss' || !okDir) {
        g.applyJudge({ grade: 'miss', score: 0 });
        return;
      }
      // wipe nearest dirty pane
      let best = null, bd = 1e9;
      const nx = x / g.W, ny = y / g.H;
      for (const d of g.state.dirt) {
        if (d.dirt <= 0) continue;
        const dd = (d.x - nx) ** 2 + (d.y - ny) ** 2;
        if (dd < bd) { bd = dd; best = d; }
      }
      if (!best) best = g.state.dirt.find(d => d.dirt > 0);
      if (best) {
        best.dirt = Math.max(0, best.dirt - (j.grade === 'perfect' ? 0.55 : 0.35));
        best.flash = 1;
        g.state.wipeFx.push({ x: best.x * g.W, y: best.y * g.H, life: 1, dir: want });
      }
      g.applyJudge(j);
      if (g.state.dirt.every(d => d.dirt <= 0)) {
        // refill lightly
        g.state.dirt.forEach(d => { d.dirt = rand(0.4, 1); });
        g.score += 150;
      }
    },
    update(g) {
      g.state.wipeFx = g.state.wipeFx.filter(f => (f.life -= 0.05) > 0);
      g.state.dirt.forEach(d => { if (d.flash > 0) d.flash -= 0.08; });
    },
    draw(g) {
      const { ctx: c, W, H } = g;
      // sky + building
      const grad = c.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#87ceeb');
      grad.addColorStop(1, '#e0f2fe');
      c.fillStyle = grad;
      c.fillRect(0, 0, W, H);

      // building
      const bx = W * 0.08, by = H * 0.18, bw = W * 0.84, bh = H * 0.7;
      c.fillStyle = '#64748b';
      roundRect(c, bx, by, bw, bh, 12);
      c.fill();
      c.fillStyle = '#475569';
      c.fillRect(bx, by - 18, bw, 22);

      for (const d of g.state.dirt) {
        const wx = d.x * W - 32, wy = d.y * H - 36, ww = 64, wh = 72;
        c.fillStyle = '#bae6fd';
        roundRect(c, wx, wy, ww, wh, 6);
        c.fill();
        c.strokeStyle = '#fff';
        c.lineWidth = 3;
        c.strokeRect(wx, wy, ww, wh);
        if (d.dirt > 0) {
          c.fillStyle = `rgba(120,90,40,${0.15 + d.dirt * 0.45})`;
          // smudges
          for (let i = 0; i < 5; i++) {
            c.beginPath();
            c.ellipse(wx + 12 + i * 10, wy + 20 + (i % 3) * 14, 8 * d.dirt, 6 * d.dirt, 0, 0, Math.PI * 2);
            c.fill();
          }
        }
        if (d.flash > 0) {
          c.fillStyle = `rgba(255,255,200,${d.flash * 0.5})`;
          c.fillRect(wx, wy, ww, wh);
        }
        if (d.dirt <= 0) {
          c.fillStyle = 'rgba(255,255,255,.5)';
          c.beginPath();
          c.moveTo(wx + 10, wy + 30);
          c.lineTo(wx + 28, wy + 50);
          c.lineTo(wx + 54, wy + 12);
          c.lineWidth = 4;
          c.strokeStyle = '#fde047';
          c.stroke();
        }
      }

      // cue arrow
      const dir = g.state.expectDir;
      c.fillStyle = 'rgba(255,255,255,.85)';
      roundRect(c, W / 2 - 70, H - 110, 140, 44, 22);
      c.fill();
      c.fillStyle = '#e11d74';
      c.font = '700 22px Fredoka,sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(dir > 0 ? '→ ふく →' : '← ふく ←', W / 2, H - 88);

      for (const f of g.state.wipeFx) {
        c.strokeStyle = `rgba(255,255,255,${f.life})`;
        c.lineWidth = 6;
        c.beginPath();
        c.moveTo(f.x - 20 * f.dir, f.y);
        c.lineTo(f.x + 20 * f.dir, f.y - 10);
        c.stroke();
      }

      drawProgress(c, W, H, g);
    }
  },

  /* ---- 2. Soup Chop ---- */
  soup: {
    init(g) {
      g.state = { items: [], nextSpawnBeat: 2, veggies: ['🥕', '🧅', '🥬', '🍅', '🥔', '🌽'] };
    },
    start(g) {
      g.rhythm.onBeat = (bi, m) => {
        if (bi >= g.state.nextSpawnBeat) {
          const travelBeats = 2;
          g.state.items.push({
            emoji: pick(g.state.veggies),
            spawnBeat: bi,
            hitBeat: bi + travelBeats,
            hit: false,
            missed: false,
            cut: 0
          });
          g.state.nextSpawnBeat = bi + 1 + (Math.random() > 0.55 ? 1 : 0);
        }
      };
    },
    onDown(x, y) {
      const g = Game;
      if (!g.playing) return;
      // hit item closest to board timing
      const boardY = g.H * 0.62;
      let best = null, bestOff = 1e9;
      for (const it of g.state.items) {
        if (it.hit || it.missed) continue;
        const tHit = it.hitBeat * g.rhythm.beatMs;
        const off = Math.abs(g.rhythm.now() - tHit);
        const prog = (g.rhythm.beatFloat() - it.spawnBeat) / (it.hitBeat - it.spawnBeat);
        const iy = -40 + prog * (boardY + 40);
        if (Math.abs(iy - boardY) < 80 && off < bestOff) { bestOff = off; best = it; }
      }
      if (!best) {
        // stray tap near beat still judges miss if far
        const j = g.rhythm.judge();
        if (j.grade === 'miss') g.applyJudge(j);
        return;
      }
      const j = g.rhythm.judgeAtTime(best.hitBeat * g.rhythm.beatMs);
      best.hit = true;
      best.cut = 1;
      g.applyJudge(j);
    },
    update(g) {
      const bf = g.rhythm.beatFloat();
      for (const it of g.state.items) {
        if (!it.hit && !it.missed && bf > it.hitBeat + 0.35) {
          it.missed = true;
          g.applyJudge({ grade: 'miss', score: 0 });
        }
        if (it.cut > 0) it.cut += 0.08;
      }
      g.state.items = g.state.items.filter(it => {
        if (it.hit) return it.cut < 2.2;
        if (it.missed) return bf < it.hitBeat + 1.2;
        return bf < it.hitBeat + 2;
      });
    },
    draw(g) {
      const { ctx: c, W, H } = g;
      c.fillStyle = '#fef3c7';
      c.fillRect(0, 0, W, H);
      // kitchen wall stripes
      c.fillStyle = '#fde68a';
      for (let i = 0; i < 8; i++) c.fillRect(0, i * 40, W, 18);

      // board
      const by = H * 0.62;
      c.fillStyle = '#b45309';
      roundRect(c, W * 0.08, by, W * 0.84, H * 0.18, 12);
      c.fill();
      c.fillStyle = '#d97706';
      roundRect(c, W * 0.1, by + 8, W * 0.8, H * 0.12, 8);
      c.fill();

      // pot
      c.fillStyle = '#78716c';
      c.beginPath();
      c.ellipse(W / 2, H * 0.88, W * 0.28, 28, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#44403c';
      roundRect(c, W * 0.28, H * 0.78, W * 0.44, H * 0.12, 8);
      c.fill();
      c.fillStyle = '#4ade80';
      c.beginPath();
      c.ellipse(W / 2, H * 0.8, W * 0.18, 14, 0, 0, Math.PI * 2);
      c.fill();

      c.font = `${Math.floor(W * 0.12)}px serif`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      for (const it of g.state.items) {
        const prog = (g.rhythm.beatFloat() - it.spawnBeat) / (it.hitBeat - it.spawnBeat);
        const x = W * 0.5 + Math.sin(prog * 6) * 10;
        let y = -40 + clamp(prog, 0, 1.15) * (by + 40);
        if (it.hit) {
          c.globalAlpha = Math.max(0, 1 - (it.cut - 1));
          c.fillText(it.emoji, x - 20 * it.cut, y - 10 * it.cut);
          c.fillText(it.emoji, x + 20 * it.cut, y + 5 * it.cut);
          c.globalAlpha = 1;
        } else {
          c.globalAlpha = it.missed ? 0.35 : 1;
          c.fillText(it.emoji, x, y);
          c.globalAlpha = 1;
        }
      }

      // timing guide line
      c.strokeStyle = 'rgba(225,29,116,.5)';
      c.setLineDash([6, 6]);
      c.beginPath();
      c.moveTo(W * 0.1, by + 20);
      c.lineTo(W * 0.9, by + 20);
      c.stroke();
      c.setLineDash([]);

      c.fillStyle = 'rgba(255,255,255,.9)';
      roundRect(c, W / 2 - 90, 70, 180, 36, 18);
      c.fill();
      c.fillStyle = '#b45309';
      c.font = '700 16px Fredoka,sans-serif';
      c.fillText('まな板でカット！', W / 2, 88);

      drawProgress(c, W, H, g);
    }
  },

  /* ---- 3. Mochi ---- */
  mochi: {
    init(g) {
      // Alternate: even beats = つく (pound), odd = こねる (knead)
      // In multiplayer, host side starts with つく; guests mirror same rhythm but cooperative feel
      g.state = {
        phase: 0, // 0 pound, 1 knead
        mochiSquash: 1,
        lastActionBeat: -1,
        sparks: [],
        teamSync: 0
      };
    },
    start(g) {
      g.rhythm.onBeat = (bi, m) => {
        g.state.phase = m % 2; // 0つく 1こねる
      };
    },
    onDown(x, y) {
      const g = Game;
      if (!g.playing) return;
      const left = x < g.W / 2;
      // left = つく, right = こねる
      const wantPhase = left ? 0 : 1;
      const j = g.rhythm.judge({ perfect: 70, great: 120, good: 170 });
      const phaseOk = Math.round(g.rhythm.measureBeat()) % 2 === wantPhase
        || Math.floor(g.rhythm.measureBeat()) % 2 === wantPhase;

      // more forgiving: check expected from nearest beat measure
      const nearestBeat = Math.round(g.rhythm.beatFloat());
      const expect = nearestBeat % 2; // 0 pound 1 knead matching start
      const ok = (left ? 0 : 1) === (expect % 2);

      if (j.grade === 'miss' || !ok) {
        g.applyJudge({ grade: 'miss', score: 0 });
        g.state.mochiSquash = 1;
        return;
      }
      g.state.mochiSquash = left ? 0.65 : 1.25;
      g.state.sparks.push({ x: g.W / 2, y: g.H * 0.45, life: 1 });
      if (j.grade === 'perfect') g.state.teamSync++;
      g.applyJudge(j);
      // broadcast action for fun sync
      Net.send({ type: 'mochi_act', phase: left ? 0 : 1, grade: j.grade });
    },
    update(g) {
      g.state.mochiSquash += (1 - g.state.mochiSquash) * 0.12;
      g.state.sparks = g.state.sparks.filter(s => (s.life -= 0.06) > 0);
    },
    draw(g) {
      const { ctx: c, W, H } = g;
      const bg = c.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#fecdd3');
      bg.addColorStop(1, '#fff1f2');
      c.fillStyle = bg;
      c.fillRect(0, 0, W, H);

      // usubachi
      c.fillStyle = '#92400e';
      c.beginPath();
      c.ellipse(W / 2, H * 0.62, W * 0.32, 36, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#b45309';
      c.beginPath();
      c.ellipse(W / 2, H * 0.58, W * 0.28, 28, 0, 0, Math.PI * 2);
      c.fill();

      // mochi
      const sq = g.state.mochiSquash;
      c.fillStyle = '#fffef5';
      c.beginPath();
      c.ellipse(W / 2, H * 0.48, 70 * sq, 55 / sq, 0, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = '#fde68a';
      c.lineWidth = 3;
      c.stroke();

      // kine
      const phase = Math.floor(g.rhythm.measureBeat()) % 2;
      const lift = phase === 0 ? Math.sin(g.rhythm.measureBeat() * Math.PI) * 40 : 10;
      c.fillStyle = '#a16207';
      c.save();
      c.translate(W / 2 + 40, H * 0.35 - lift);
      c.rotate(-0.4);
      roundRect(c, -8, -60, 16, 90, 6);
      c.fill();
      c.restore();

      for (const s of g.state.sparks) {
        c.fillStyle = `rgba(251,191,36,${s.life})`;
        for (let i = 0; i < 6; i++) {
          const a = i * Math.PI / 3;
          c.beginPath();
          c.arc(s.x + Math.cos(a) * 30 * (1 - s.life), s.y + Math.sin(a) * 20 * (1 - s.life), 4, 0, Math.PI * 2);
          c.fill();
        }
      }

      // buttons zones
      drawZoneBtn(c, 16, H * 0.72, W / 2 - 24, 70, phase === 0, '🔨 つく', '#fb7185');
      drawZoneBtn(c, W / 2 + 8, H * 0.72, W / 2 - 24, 70, phase === 1, '👐 こねる', '#60a5fa');

      c.fillStyle = 'rgba(255,255,255,.9)';
      roundRect(c, W / 2 - 100, 70, 200, 36, 18);
      c.fill();
      c.fillStyle = '#be123c';
      c.font = '700 15px Fredoka,sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(phase === 0 ? 'いま：つく！' : 'いま：こねる！', W / 2, 88);

      drawProgress(c, W, H, g);
    }
  },

  /* ---- 4. Hammer / Whack ---- */
  hammer: {
    init(g) {
      const holes = [];
      for (let r = 0; r < 2; r++) {
        for (let col = 0; col < 3; col++) {
          holes.push({
            x: 0.22 + col * 0.28,
            y: 0.38 + r * 0.28,
            pop: 0, // 0 hidden .. 1 up
            alive: false,
            hitBeat: 0,
            whacked: false,
            missChecked: false
          });
        }
      }
      g.state = { holes, queueBeat: 2, hammerAng: 0 };
    },
    start(g) {
      g.rhythm.onBeat = (bi) => {
        if (bi >= g.state.queueBeat) {
          const free = g.state.holes.filter(h => !h.alive);
          if (free.length) {
            const h = pick(free);
            h.alive = true;
            h.pop = 0;
            h.whacked = false;
            h.missChecked = false;
            h.hitBeat = bi + 1; // peaks next beat
            h.spawnBeat = bi;
          }
          g.state.queueBeat = bi + (Math.random() > 0.4 ? 1 : 2);
        }
      };
    },
    onDown(x, y) {
      const g = Game;
      if (!g.playing) return;
      g.state.hammerAng = 1;
      let hit = null;
      for (const h of g.state.holes) {
        if (!h.alive || h.whacked) continue;
        const hx = h.x * g.W, hy = h.y * g.H - h.pop * 36;
        if (Math.hypot(x - hx, y - hy) < 48) { hit = h; break; }
      }
      if (!hit) {
        // miss tap
        return;
      }
      const j = g.rhythm.judgeAtTime(hit.hitBeat * g.rhythm.beatMs, { perfect: 75, great: 130, good: 180 });
      hit.whacked = true;
      hit.alive = false;
      g.applyJudge(j);
      AudioBus.sfxHit();
    },
    update(g) {
      const bf = g.rhythm.beatFloat();
      g.state.hammerAng *= 0.85;
      for (const h of g.state.holes) {
        if (!h.alive) { h.pop *= 0.8; continue; }
        const t = (bf - h.spawnBeat) / (h.hitBeat - h.spawnBeat);
        // rise then fall
        if (t < 1) h.pop = Math.sin(clamp(t, 0, 1) * Math.PI);
        else h.pop = Math.max(0, 1 - (t - 1) * 2);
        if (!h.whacked && !h.missChecked && bf > h.hitBeat + 0.4) {
          h.missChecked = true;
          h.alive = false;
          g.applyJudge({ grade: 'miss', score: 0 });
        }
      }
    },
    draw(g) {
      const { ctx: c, W, H } = g;
      c.fillStyle = '#86efac';
      c.fillRect(0, 0, W, H);
      // grass hills
      c.fillStyle = '#4ade80';
      c.beginPath();
      c.moveTo(0, H * 0.3);
      c.quadraticCurveTo(W * 0.25, H * 0.18, W * 0.5, H * 0.28);
      c.quadraticCurveTo(W * 0.75, H * 0.38, W, H * 0.22);
      c.lineTo(W, 0); c.lineTo(0, 0); c.fill();
      c.fillStyle = '#bbf7d0';
      c.fillRect(0, H * 0.28, W, H);

      for (const h of g.state.holes) {
        const hx = h.x * W, hy = h.y * H;
        // hole
        c.fillStyle = '#292524';
        c.beginPath();
        c.ellipse(hx, hy + 18, 42, 16, 0, 0, Math.PI * 2);
        c.fill();
        if (h.pop > 0.05) {
          const my = hy - h.pop * 40;
          c.fillStyle = '#a16207';
          c.beginPath();
          c.ellipse(hx, my, 28, 32, 0, 0, Math.PI * 2);
          c.fill();
          c.fillStyle = '#fff';
          c.beginPath(); c.arc(hx - 10, my - 8, 6, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.arc(hx + 10, my - 8, 6, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#000';
          c.beginPath(); c.arc(hx - 10, my - 8, 2.5, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.arc(hx + 10, my - 8, 2.5, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#fca5a5';
          c.beginPath(); c.ellipse(hx, my + 10, 10, 6, 0, 0, Math.PI * 2); c.fill();
        }
      }

      c.fillStyle = 'rgba(255,255,255,.9)';
      roundRect(c, W / 2 - 100, 70, 200, 36, 18);
      c.fill();
      c.fillStyle = '#15803d';
      c.font = '700 15px Fredoka,sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText('モグラをピコッ！', W / 2, 88);

      drawProgress(c, W, H, g);
    }
  },

  /* ---- 5. Firework ---- */
  firework: {
    init(g) {
      g.state = {
        rockets: [],
        bursts: [],
        nextBeat: 2
      };
    },
    start(g) {
      g.rhythm.onBeat = (bi, m) => {
        if (m === 0 || (m === 2 && Math.random() > 0.4)) {
          // launch so peak lands on a future downbeat
          const peakBeat = bi + 2;
          g.state.rockets.push({
            spawnBeat: bi,
            peakBeat,
            x: rand(0.2, 0.8),
            color: pick(['#fb7185', '#fbbf24', '#60a5fa', '#c084fc', '#4ade80', '#f97316']),
            hit: false,
            missed: false
          });
        }
      };
    },
    onDown(x, y) {
      const g = Game;
      if (!g.playing) return;
      // find rocket near peak
      let best = null, bestOff = 1e9;
      for (const r of g.state.rockets) {
        if (r.hit || r.missed) continue;
        const peakT = r.peakBeat * g.rhythm.beatMs;
        const off = Math.abs(g.rhythm.now() - peakT);
        const prog = (g.rhythm.beatFloat() - r.spawnBeat) / (r.peakBeat - r.spawnBeat);
        if (prog > 0.55 && prog < 1.25 && off < bestOff) {
          bestOff = off; best = r;
        }
      }
      if (!best) {
        const j = g.rhythm.judge();
        if (j.grade !== 'miss') {
          // nice tap but no rocket — small score
          g.score += 5;
          g.updateHud();
        }
        return;
      }
      const j = g.rhythm.judgeAtTime(best.peakBeat * g.rhythm.beatMs, { perfect: 65, great: 120, good: 170 });
      best.hit = true;
      this._burst(g, best, j.grade);
      g.applyJudge(j);
      if (j.grade !== 'miss') AudioBus.sfxFirework();
    },
    _burst(g, rocket, grade) {
      const n = grade === 'perfect' ? 36 : grade === 'great' ? 24 : grade === 'good' ? 16 : 8;
      const particles = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + rand(-.1, .1);
        const sp = (grade === 'perfect' ? 4.5 : 3) * rand(0.7, 1.2);
        particles.push({
          x: rocket.x * g.W,
          y: g.H * (0.75 - 0.45), // peak y approx
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 1,
          color: rocket.color
        });
      }
      // fix peak y
      const prog = 1;
      const peakY = g.H * 0.75 - prog * g.H * 0.45;
      particles.forEach(p => { p.y = peakY; });
      g.state.bursts.push({ particles, life: 1 });
    },
    update(g) {
      const bf = g.rhythm.beatFloat();
      for (const r of g.state.rockets) {
        if (!r.hit && !r.missed && bf > r.peakBeat + 0.35) {
          r.missed = true;
          g.applyJudge({ grade: 'miss', score: 0 });
          // fizzle
          g.state.bursts.push({
            particles: Array.from({ length: 6 }, () => ({
              x: r.x * g.W, y: g.H * 0.3, vx: rand(-1, 1), vy: rand(-1, 1),
              life: 1, color: '#94a3b8'
            })),
            life: 1
          });
        }
      }
      g.state.rockets = g.state.rockets.filter(r => bf < r.peakBeat + 1.5);
      for (const b of g.state.bursts) {
        b.life -= 0.02;
        for (const p of b.particles) {
          p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 0.02;
        }
      }
      g.state.bursts = g.state.bursts.filter(b => b.life > 0);
    },
    draw(g) {
      const { ctx: c, W, H } = g;
      const sky = c.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#0f172a');
      sky.addColorStop(0.6, '#1e1b4b');
      sky.addColorStop(1, '#312e81');
      c.fillStyle = sky;
      c.fillRect(0, 0, W, H);
      // stars
      c.fillStyle = '#fff';
      for (let i = 0; i < 40; i++) {
        const sx = (i * 97) % W, sy = (i * 53) % (H * 0.6);
        c.globalAlpha = 0.3 + (i % 5) * 0.1;
        c.fillRect(sx, sy, 2, 2);
      }
      c.globalAlpha = 1;

      const bf = g.rhythm.beatFloat();
      for (const r of g.state.rockets) {
        if (r.hit || r.missed) continue;
        const prog = clamp((bf - r.spawnBeat) / (r.peakBeat - r.spawnBeat), 0, 1.2);
        const x = r.x * W;
        const y = H * 0.85 - Math.min(prog, 1) * H * 0.5;
        // trail
        c.strokeStyle = r.color;
        c.globalAlpha = 0.6;
        c.lineWidth = 3;
        c.beginPath();
        c.moveTo(x, y + 30);
        c.lineTo(x, y);
        c.stroke();
        c.globalAlpha = 1;
        // head / bloom size peaks at 1
        const bloom = prog < 1 ? prog * 0.5 : Math.max(0, 1 - (prog - 1) * 3);
        const rad = 8 + bloom * 40;
        c.fillStyle = r.color;
        c.beginPath();
        c.arc(x, y, rad, 0, Math.PI * 2);
        c.fill();
        if (Math.abs(prog - 1) < 0.08) {
          c.strokeStyle = '#fff';
          c.lineWidth = 2;
          c.beginPath();
          c.arc(x, y, rad + 8, 0, Math.PI * 2);
          c.stroke();
        }
      }

      for (const b of g.state.bursts) {
        for (const p of b.particles) {
          if (p.life <= 0) continue;
          c.fillStyle = p.color;
          c.globalAlpha = p.life;
          c.beginPath();
          c.arc(p.x, p.y, 3, 0, Math.PI * 2);
          c.fill();
        }
      }
      c.globalAlpha = 1;

      c.fillStyle = 'rgba(255,255,255,.15)';
      roundRect(c, W / 2 - 110, 70, 220, 36, 18);
      c.fill();
      c.fillStyle = '#fde68a';
      c.font = '700 15px Fredoka,sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText('開いた瞬間にタップ！', W / 2, 88);

      drawProgress(c, W, H, g);
    }
  }
};

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawZoneBtn(c, x, y, w, h, active, label, color) {
  c.fillStyle = active ? color : 'rgba(255,255,255,.75)';
  roundRect(c, x, y, w, h, 16);
  c.fill();
  if (active) {
    c.strokeStyle = '#fff';
    c.lineWidth = 3;
    c.stroke();
  }
  c.fillStyle = active ? '#fff' : '#374151';
  c.font = '700 18px Fredoka,sans-serif';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(label, x + w / 2, y + h / 2);
}

function drawProgress(c, W, H, g) {
  const left = Math.max(0, g.endAt - performance.now());
  const p = left / g.durationMs;
  c.fillStyle = 'rgba(0,0,0,.25)';
  roundRect(c, 16, H - 8, W - 32, 6, 3);
  c.fill();
  c.fillStyle = '#fff';
  roundRect(c, 16, H - 8, (W - 32) * p, 6, 3);
  c.fill();
}

/* ========== UI Controller ========== */
const UI = {
  init() {
    const saved = localStorage.getItem('minba_name');
    if (saved) $('#player-name').value = saved;

    $('#btn-create').onclick = () => this.create();
    $('#btn-join-show').onclick = () => {
      $('#join-panel').style.display = 'block';
    };
    $('#btn-join').onclick = () => this.join();
    $('#btn-solo').onclick = () => this.solo();
    $('#btn-leave').onclick = () => this.leave();
    $('#btn-copy').onclick = () => {
      const code = Net.hostId;
      if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => toast('ルームIDをコピーしたよ'));
      else toast(code);
    };
    $('#btn-back-game').onclick = () => {
      if (Net.isHost) Net.broadcast({ type: 'abort' });
      Game.stopToLobby();
    };
    $('#btn-result-ok').onclick = () => Game.stopToLobby();

    // game list
    const list = $('#game-list');
    GAMES.forEach(g => {
      const btn = document.createElement('button');
      btn.className = 'game-card';
      btn.innerHTML = `<div class="icon" style="background:${g.color}">${g.icon}</div>
        <div><h3>${g.title}</h3><p>${g.desc}</p></div>`;
      btn.onclick = () => this.pickGame(g);
      list.appendChild(btn);
    });

    Net.onPlayers = (list) => this.renderPlayers(list);
    Net.onStatus = (text, ok) => {
      $('#net-status').innerHTML = `<span class="online-dot${ok ? '' : ' offline-dot'}"></span>${text}`;
    };
    Net.onMessage = (msg) => this.onNet(msg);

    Game.init();
  },

  name() {
    const n = ($('#player-name').value || '').trim() || 'プレイヤー' + Math.floor(Math.random() * 90 + 10);
    $('#player-name').value = n;
    localStorage.setItem('minba_name', n);
    return n;
  },

  async create() {
    try {
      $('#btn-create').disabled = true;
      const id = await Net.createRoom(this.name());
      this.enterLobby(id);
    } catch (e) {
      toast(e.message || 'ルーム作成に失敗');
      console.error(e);
    } finally {
      $('#btn-create').disabled = false;
    }
  },

  async join() {
    const code = ($('#join-code').value || '').trim().toUpperCase();
    if (code.length < 4) { toast('ルームIDを入力してね'); return; }
    try {
      $('#btn-join').disabled = true;
      await Net.joinRoom(code, this.name());
      this.enterLobby(code);
    } catch (e) {
      toast(e.message || '参加に失敗');
      console.error(e);
    } finally {
      $('#btn-join').disabled = false;
    }
  },

  solo() {
    Net.startSolo(this.name());
    this.enterLobby('SOLO');
    toast('ひとり練習モード');
  },

  enterLobby(code) {
    $('#room-code-display').textContent = code;
    $('#room-badge').textContent = 'ROOM ' + code;
    $('#lobby-hint').textContent = Net.solo
      ? 'ソロモード：好きなゲームを選んで練習しよう'
      : (Net.isHost ? 'このIDを友達に伝えてね（最大4人）' : 'ホストがゲームを選ぶまで待ってね');
    $('#pick-hint').textContent = Net.isHost || Net.solo
      ? 'タップしてミニゲームをスタート！'
      : 'ホストが選ぶまで待機中…';
    this.refreshLobby();
    showScreen('#lobby-screen');
  },

  refreshLobby() {
    this.renderPlayers([...Net.players.values()]);
    // enable/disable game cards for non-host
    $$('.game-card').forEach(b => {
      b.disabled = !(Net.isHost || Net.solo);
      b.style.opacity = b.disabled ? 0.55 : 1;
    });
  },

  renderPlayers(list) {
    const el = $('#player-list');
    el.innerHTML = '';
    list.forEach(p => {
      const chip = document.createElement('div');
      chip.className = 'player-chip' + (p.isHost ? ' host' : '');
      chip.innerHTML = `<span class="dot"></span>${escapeHtml(p.name)}${p.id === Net.myId ? ' (あなた)' : ''}${p.isHost ? ' ★' : ''}`;
      el.appendChild(chip);
    });
  },

  pickGame(g) {
    if (!(Net.isHost || Net.solo)) {
      toast('ホストだけがゲームを選べます');
      return;
    }
    Net.send({ type: 'start_game', gameId: g.id });
    this.launch(g.id);
  },

  launch(gameId) {
    const g = GAMES.find(x => x.id === gameId);
    if (!g) return;
    Game.start(g);
  },

  onNet(msg) {
    if (msg.type === 'players') {
      Net.players.clear();
      (msg.list || []).forEach(p => Net.players.set(p.id, p));
      this.renderPlayers([...Net.players.values()]);
    } else if (msg.type === 'start_game') {
      if (!Net.isHost) this.launch(msg.gameId);
    } else if (msg.type === 'full') {
      toast('ルームが満員です（最大4人）');
      this.leave();
    } else if (msg.type === 'abort') {
      if (!Net.isHost) {
        toast('ホストがゲームを終了しました');
        Game.stopToLobby();
      }
    } else if (msg.type === 'game_end') {
      if (!Game.ended) Game.endGame();
    } else if (msg.type === 'welcome' && !Net.isHost) {
      // noop
    }
  },

  leave() {
    Net.destroy();
    showScreen('#home-screen');
    toast('ロビーを退出しました');
  }
};

// Prevent pull-to-refresh / overscroll annoyances on mobile
document.addEventListener('touchmove', (e) => {
  if (e.target.closest('#gameCanvas')) e.preventDefault();
}, { passive: false });

UI.init();
})();
</script>
